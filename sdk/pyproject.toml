[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantsynthica"
version = "1.1.1"
description = "Universal Financial Intelligence & Quantitative Finance Library (yfinance, TradingView, DCF, MPT)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "QuantSynthica Team", email = "dev@quantsynthica.io"}
]
keywords = [
    "quantitative-finance",
    "trading",
    "yfinance",
    "tradingview",
    "screener",
    "dcf",
    "portfolio-optimization",
    "backtesting",
    "financial-data"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "yfinance>=0.2.36",
    "tradingview-screener>=3.2.0",
    "beautifulsoup4>=4.12.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "httpx>=0.25.0",
    "requests>=2.31.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "build>=1.0.0",
    "twine>=5.0.0"
]

[project.urls]
Homepage = "https://github.com/michaelfernandes/quantsynthica-api"
Documentation = "https://github.com/michaelfernandes/quantsynthica-api#readme"
Repository = "https://github.com/michaelfernandes/quantsynthica-api"
Issues = "https://github.com/michaelfernandes/quantsynthica-api/issues"
